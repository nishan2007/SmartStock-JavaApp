<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>SmartStock Photo</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div><strong>SmartStock</strong><span>Item Photo</span></div></header><main>
<section id="photoCard" class="card"><h1>Add item photo</h1><p id="photoStatus">Checking this photo link…</p><div id="photoControls" class="hidden"><p>Photo for <strong id="targetName"></strong></p><div id="photoPreview" class="preview">No photo selected</div><div class="photo-actions"><label class="button">Take photo<input id="photoCamera" type="file" accept="image/*" capture="environment" hidden></label><label class="button secondary">Choose from Photos<input id="photoLibrary" type="file" accept="image/*" hidden></label></div><button id="photoUpload" disabled>Upload photo</button><progress id="photoProgress" class="hidden"></progress></div></section>
</main><script src="/photo.js"></script></body></html>
