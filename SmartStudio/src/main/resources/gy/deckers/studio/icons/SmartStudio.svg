<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">SmartStudio Creative Brush</title>
  <desc id="description">A purple and gold artist's brush crossing a warm white folded page on a rounded plum tile. Refined scalable vector interpretation of the selected SmartStudio icon concept.</desc>
